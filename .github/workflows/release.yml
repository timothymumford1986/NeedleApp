name: release

# Publishes an installable APK to a GitHub Release, so the app can be
# downloaded and sideloaded without a toolchain.
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# SIGNING
#
# The release is signed with a key held in repository secrets: KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. The keystore is decoded to a
# file under RUNNER_TEMP, never into the workspace, so it cannot be picked up by
# a later step or an artefact upload.
#
# Android identifies an app by its signing key for the life of the install. This
# key therefore cannot be rotated: if it is lost, no future build can install
# over an existing one and every user has to uninstall first, losing their
# settings and their downloaded music. A copy lives outside GitHub as well.
#
# Signing also unlocks the size difference: the debug build is ~25 MB, the
# minified and resource-shrunk release is ~3.8 MB.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # A release that fails its own tests is worse than no release.
      - name: Unit tests
        run: ./gradlew test -Pneedler.screenshots.verify --stacktrace

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set; refusing to publish an unsigned release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/needler-release.jks"
          echo "Decoded $(stat -c%s "$RUNNER_TEMP/needler-release.jks") bytes"

      - name: Assemble
        env:
          NEEDLER_KEYSTORE: ${{ runner.temp }}/needler-release.jks
          NEEDLER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NEEDLER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NEEDLER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify the APK is actually signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/needler-release.jks"

      - name: Name the artefacts after the tag
        id: rename
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/needler-$TAG.apk"
          if [ -f wear/build/outputs/apk/release/wear-release.apk ]; then
            cp wear/build/outputs/apk/release/wear-release.apk "dist/needler-wear-$TAG.apk"
          fi
          ls -la dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rename.outputs.tag }}
          name: Needler ${{ steps.rename.outputs.tag }}
          generate_release_notes: true
          files: dist/*.apk
          body: |
            Download the `.apk` below and open it on your Android phone to install.

            Your phone will warn you about installing from an unknown source — that
            is expected for an app distributed outside the Play Store, and you will
            need to allow it for whichever app you download with.

            Requires Android 8.0 or later, and a DroppedNeedle server you can reach.
