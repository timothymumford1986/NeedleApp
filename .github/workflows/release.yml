name: release

# Publishes an installable APK to a GitHub Release, so the app can be
# downloaded and sideloaded without a toolchain.
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# SIGNING, and why this currently ships a debug-signed build.
#
# Android will not install an unsigned APK, so a release needs a key. A proper
# release key has to live in GitHub Secrets, and it carries a permanent
# commitment: Android identifies an app by its signing key, so if that key is
# ever lost, no future build can be installed over an existing one -- users have
# to uninstall first, losing their settings and downloaded music.
#
# Until that key exists, this publishes the debug-signed APK. It installs and
# runs perfectly well on a phone. It is larger, unoptimised, debuggable, and
# must never be the basis of a public distribution -- but for putting builds on
# your own devices it is exactly right.
#
# To upgrade later: create a keystore, add KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS and KEY_PASSWORD as repository secrets, give :app a release signing
# config that reads them, and swap assembleDebug for assembleRelease below.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # A release that fails its own tests is worse than no release.
      - name: Unit tests
        run: ./gradlew test -Pneedler.screenshots.verify --stacktrace

      - name: Assemble
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the artefacts after the tag
        id: rename
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/needler-$TAG.apk"
          if [ -f wear/build/outputs/apk/debug/wear-debug.apk ]; then
            cp wear/build/outputs/apk/debug/wear-debug.apk "dist/needler-wear-$TAG.apk"
          fi
          ls -la dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rename.outputs.tag }}
          name: Needler ${{ steps.rename.outputs.tag }}
          generate_release_notes: true
          files: dist/*.apk
          body: |
            Download the `.apk` below and open it on your Android phone to install.

            Your phone will warn you about installing from an unknown source — that
            is expected for an app distributed outside the Play Store, and you will
            need to allow it for whichever app you download with.

            **This is a debug-signed build.** It installs and runs, but it is
            unoptimised and debuggable. It is intended for your own devices.

            Requires Android 8.0 or later, and a DroppedNeedle server you can reach.
