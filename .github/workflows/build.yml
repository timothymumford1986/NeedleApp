name: build

# The project compiles to Java 17 bytecode but must be BUILT on JDK 21: Gradle
# 9.6 runs on it, and Robolectric's screenshot renders need JVM flags the
# screenshot convention plugin passes (--add-exports java.base/jdk.internal.access),
# which behave correctly only on a modern JDK.
#
# compileSdk is 37 (packages are named android-37.x, not plain android-37):
# okhttp-android 5.5.0 and the androidx libraries all declare minCompileSdk=37.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # v3's default `packages` input is "tools platform-tools", and the `tools`
      # package was removed from Google's SDK repository years ago, so every run
      # died here. Pin v4 and name exactly what this project needs.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      # Gradle itself comes from the committed wrapper. This step is only here
      # for the build and dependency caches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      # `needler.screenshots.verify` puts Roborazzi in compare-and-fail mode
      # instead of overwrite, so the committed PNGs act as regression tests: a
      # screen that changes unintentionally fails here rather than drifting
      # silently. Without the flag the test task would simply rewrite them.
      - name: Unit tests, and verify the committed screenshots
        run: ./gradlew test -Pneedler.screenshots.verify --stacktrace

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore
