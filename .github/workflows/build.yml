name: build

# The project compiles to Java 17 bytecode but must be BUILT on JDK 21: Gradle
# 9.6 runs on it, and Robolectric's screenshot renders need JVM flags the
# screenshot convention plugin passes (--add-exports java.base/jdk.internal.access),
# which behave correctly only on a modern JDK.
#
# compileSdk is 37 (packages are named android-37.x, not plain android-37):
# okhttp-android 5.5.0 and the androidx libraries all declare minCompileSdk=37.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # v3's default `packages` input is "tools platform-tools", and the `tools`
      # package was removed from Google's SDK repository years ago, so every run
      # died here. Pin v4 and name exactly what this project needs.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      # Gradle itself comes from the committed wrapper. This step is only here
      # for the build and dependency caches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      # `needler.screenshots.verify` puts Roborazzi in compare-and-fail mode
      # instead of overwrite, so the committed PNGs act as regression tests: a
      # screen that changes unintentionally fails here rather than drifting
      # silently. Without the flag the test task would simply rewrite them.
      - name: Unit tests, and verify the committed screenshots
        run: ./gradlew test -Pneedler.screenshots.verify --stacktrace

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Instrumented tests, on an emulator this job boots itself.
  #
  # The point of this job is that nothing about Needler should need a physical
  # phone plugged in to be verified. Three tiers cover the app between them:
  #
  #   * JVM unit tests (`test`, in the job above) for every piece of logic;
  #   * Roborazzi screenshots (also `test`) for what each screen looks like;
  #   * this job for the handful of things that only exist on a real Android
  #     runtime - the Keystore, SQLite, a bound Service, the PackageInstaller.
  #
  # A test that could run in any of the first two does not belong here: the
  # emulator costs four minutes of boot before a single assertion runs.
  #
  # `connectedDebugAndroidTest` is matched by name across every subproject, so a
  # new `src/androidTest` folder anywhere is picked up without editing this file.
  # Modules with no instrumented sources are skipped. The one to watch is
  # `:wear`, which ships its own APK: if it ever grows instrumented tests they
  # will install a Wear app onto a phone image, and it will need its own AVD.
  # ---------------------------------------------------------------------------
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Without KVM the emulator falls back to software CPU emulation, which is
      # roughly twenty times slower - the job does not fail, it times out, which
      # is a far worse thing to debug. The runner image ships /dev/kvm owned by
      # root; the udev rule opens it to the unprivileged user the job runs as.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The same packages the build job installs. The system image is not among
      # them: android-emulator-runner installs the one it is asked for below.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Booting a fresh AVD costs several minutes every run. Creating it once and
      # restoring the snapshot afterwards turns that into seconds. The key carries
      # the API level so bumping it below rebuilds the image rather than restoring
      # the wrong one.
      - name: Cache the AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-36-google_apis-x86_64

      - name: Create the AVD and snapshot it
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          # google_apis rather than the bare AOSP image: Play services are absent
          # from both, but google_apis carries the WebView and the keystore
          # provider configuration a stock retail device has.
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created."

      # targetSdk is 36, so that is what the tests run against. compileSdk 37 is
      # a compile-time concern only and does not need a 37 system image.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # -no-snapshot-save: the snapshot restored above is the clean one, and
          # writing the post-test state back over it would carry whatever the
          # last run installed into the next.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore
