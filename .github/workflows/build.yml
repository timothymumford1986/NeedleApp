name: build

# JDK 17 is both AGP 9's minimum and the source/target level the project
# compiles against (see build-logic/convention).
#
# WRAPPER CAVEAT: gradle/wrapper/gradle-wrapper.jar is a binary and is not in
# the repository — it cannot be generated without a local Gradle install, and
# fabricating one would be worse than not having it. Until someone runs
# `gradle wrapper --gradle-version 9.6.1` locally and commits gradlew,
# gradlew.bat and gradle-wrapper.jar, `./gradlew` does not exist. This workflow
# therefore installs Gradle 9.6.1 itself and generates the wrapper if it is
# missing, so CI is green either way. Once the wrapper is committed the generate
# step is a no-op and can be deleted along with the `gradle-version` input.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Also provides the Gradle build cache and dependency cache, keyed on the
      # build files and gradle/libs.versions.toml.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          # Only the default branch writes to the shared cache.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # compileSdk 37 and build-tools may not be preinstalled on the runner;
      # this accepts the SDK licences so AGP can fetch what it needs.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate the Gradle wrapper if it is missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar absent - generating the wrapper with Gradle $(gradle --version | awk '/^Gradle/ {print $2}')"
            gradle wrapper --gradle-version 9.6.1
          else
            echo "gradle-wrapper.jar present - using the committed wrapper"
          fi

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/problems/
          if-no-files-found: ignore
