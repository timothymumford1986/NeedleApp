# Needler — Gradle properties
#
# JVM args: KSP2 runs inside the Gradle daemon rather than the Kotlin compile
# daemon, so the daemon heap has to carry annotation processing for twelve
# modules (Room + Hilt). 4 GB with a raised metaspace is the figure KSP's own
# docs suggest. src: https://github.com/google/ksp/blob/main/docs/ksp2.md
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel execution and build caching across the twelve modules.
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache. AGP 9, KSP 2.3 and the Hilt 2.60 Gradle plugin all
# support it. If a plugin ever regresses, use
#   ./gradlew --configuration-cache-problems=warn <task>
# to triage rather than switching this off for everyone.
org.gradle.configuration-cache=true

# AndroidX. This is the default from AGP 9 onwards; stated explicitly so the
# intent survives a toolchain downgrade.
android.useAndroidX=true

# Non-transitive R classes: each module sees only its own resources, which is
# what keeps :core:design's resources from leaking into every feature's R.
# Default since AGP 8.0 and enforced in AGP 9; stated explicitly for the same
# reason as above.
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
